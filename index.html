<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Architecture Diagram Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text: #e2e8f0;
      --muted: #64748b;
      --danger: #f87171;
      --warn: #fbbf24;
      --success: #34d399;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header svg { flex-shrink: 0; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    header span { font-size: 0.8rem; color: var(--muted); }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 0;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .upload-area {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(99,102,241,.06);
    }
    .drop-zone input { display: none; }
    .drop-zone .icon { font-size: 2rem; margin-bottom: 8px; }
    .drop-zone p { font-size: .85rem; color: var(--muted); margin-top: 4px; }
    .drop-zone strong { color: var(--text); font-size: .9rem; }

    .file-info {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: 8px;
      font-size: .85rem;
    }
    .file-info.show { display: flex; }
    .file-info .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-info .clear { cursor: pointer; color: var(--muted); font-size: 1rem; flex-shrink: 0; }
    .file-info .clear:hover { color: var(--danger); }

    .btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .toast {
      display: none;
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: .82rem;
      line-height: 1.4;
    }
    .toast.show { display: block; }
    .toast.ok  { background: rgba(52,211,153,.12); color: var(--success); border: 1px solid rgba(52,211,153,.25); }
    .toast.err { background: rgba(248,113,113,.12); color: var(--danger);  border: 1px solid rgba(248,113,113,.25); }

    .diagrams-header {
      padding: 14px 20px 10px;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .diagrams-header button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: .75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .diagrams-header button:hover { color: var(--danger); background: rgba(248,113,113,.1); }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 16px;
    }
    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: .85rem;
      padding: 40px 16px;
    }

    .diagram-item {
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      margin-bottom: 4px;
      transition: background .15s, border-color .15s;
    }
    .diagram-item:hover { background: var(--surface); }
    .diagram-item.active { background: var(--surface); border-color: var(--accent); }

    .item-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .item-name {
      flex: 1;
      font-size: .88rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      font-size: .7rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      flex-shrink: 0;
      letter-spacing: .03em;
    }
    .badge-RECEBIDO       { background: rgba(100,116,139,.2); color: #94a3b8; }
    .badge-EM_PROCESSAMENTO { background: rgba(251,191,36,.15); color: var(--warn); }
    .badge-ANALISADO      { background: rgba(52,211,153,.15); color: var(--success); }
    .badge-ERRO           { background: rgba(248,113,113,.15); color: var(--danger); }

    .item-id {
      font-size: .72rem;
      color: var(--muted);
      font-family: monospace;
    }

    /* ── Main panel ── */
    .main {
      overflow-y: auto;
      padding: 28px 32px;
    }
    .main::-webkit-scrollbar { width: 4px; }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      gap: 12px;
      font-size: .9rem;
    }
    .placeholder svg { opacity: .3; }

    .report-header { margin-bottom: 24px; }
    .report-header h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 6px; }
    .report-meta { font-size: .8rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }

    .status-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .status-card .label { font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
    .status-card .value { font-size: .95rem; font-weight: 500; }

    .section { margin-bottom: 28px; }
    .section h3 {
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .summary-box {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px 18px;
      font-size: .88rem;
      line-height: 1.65;
      border: 1px solid var(--border);
      color: #cbd5e1;
    }

    .chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: rgba(99,102,241,.1);
      border: 1px solid rgba(99,102,241,.2);
      color: #a5b4fc;
      font-size: .8rem;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .risk-list, .rec-list { display: flex; flex-direction: column; gap: 8px; }
    .risk-item, .rec-item {
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: .86rem;
      line-height: 1.5;
    }
    .risk-item { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.15); }
    .rec-item  { background: rgba(52,211,153,.07);  border: 1px solid rgba(52,211,153,.15); }
    .risk-item::before { content: '⚠'; flex-shrink: 0; }
    .rec-item::before  { content: '✓'; flex-shrink: 0; color: var(--success); }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--warn);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .processing-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(251,191,36,.08);
      border: 1px solid rgba(251,191,36,.2);
      border-radius: var(--radius);
      font-size: .88rem;
      color: var(--warn);
      margin-bottom: 24px;
    }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 320px; }
    }
  </style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
    <rect width="28" height="28" rx="7" fill="#6366f1"/>
    <path d="M8 14h4M16 14h4M14 8v4M14 16v4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="14" cy="14" r="2.5" fill="#fff"/>
  </svg>
  <div>
    <h1>Architecture Diagram Analyzer</h1>
    <span>FIAP Hackathon — SOAT</span>
  </div>
</header>

<div class="layout">
  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="upload-area">
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" />
        <div class="icon">📐</div>
        <strong>Selecione ou arraste um diagrama</strong>
        <p>PDF, PNG, JPG ou JPEG — máx. 10 MB</p>
      </div>

      <div class="file-info" id="fileInfo">
        <span>📄</span>
        <span class="name" id="fileName"></span>
        <span class="clear" id="clearFile" title="Remover">✕</span>
      </div>

      <button class="btn" id="uploadBtn" disabled>Analisar diagrama</button>
      <div class="toast" id="toast"></div>
    </div>

    <div class="diagrams-header">
      <span>Meus diagramas</span>
      <button id="clearAll" title="Limpar histórico">Limpar</button>
    </div>

    <div class="list" id="diagramList">
      <div class="empty" id="emptyMsg">Nenhum diagrama enviado ainda.</div>
    </div>
  </aside>

  <!-- ── Main panel ── -->
  <main class="main" id="mainPanel">
    <div class="placeholder" id="placeholder">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <rect width="56" height="56" rx="14" fill="#1a1d27"/>
        <path d="M18 28h6M32 28h6M28 18v6M28 32v6" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="28" cy="28" r="4" stroke="#4b5563" stroke-width="2.5"/>
      </svg>
      <span>Selecione um diagrama para ver o relatório</span>
    </div>
    <div id="reportPanel" style="display:none"></div>
  </main>
</div>

<script>
const API = 'http://localhost:8000';
const STORAGE_KEY = 'arch_diagrams';
const POLL_MS = 3000;

// ── State ──────────────────────────────────────────────────────────────────
let diagrams = loadDiagrams();
let selectedId = null;
let pollTimer = null;

// ── Persistence ───────────────────────────────────────────────────────────
function loadDiagrams() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}
function saveDiagrams() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(diagrams));
}

// ── Upload ─────────────────────────────────────────────────────────────────
const dropZone  = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileInfo  = document.getElementById('fileInfo');
const fileNameEl = document.getElementById('fileName');
const clearFileBtn = document.getElementById('clearFile');
const uploadBtn = document.getElementById('uploadBtn');
const toast     = document.getElementById('toast');

let selectedFile = null;

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) setFile(f);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });
clearFileBtn.addEventListener('click', clearFile);

function setFile(f) {
  const allowed = ['application/pdf', 'image/png', 'image/jpeg'];
  if (!allowed.includes(f.type) && !f.name.match(/\.(pdf|png|jpe?g)$/i)) {
    showToast('Formato inválido. Use PDF, PNG ou JPG.', 'err');
    return;
  }
  if (f.size > 10 * 1024 * 1024) {
    showToast('Arquivo muito grande. Máximo 10 MB.', 'err');
    return;
  }
  selectedFile = f;
  fileNameEl.textContent = f.name;
  fileInfo.classList.add('show');
  uploadBtn.disabled = false;
  hideToast();
}

function clearFile() {
  selectedFile = null;
  fileInput.value = '';
  fileInfo.classList.remove('show');
  uploadBtn.disabled = true;
}

uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  uploadBtn.disabled = true;
  uploadBtn.textContent = 'Enviando…';
  hideToast();

  const form = new FormData();
  form.append('file', selectedFile);

  try {
    const res = await fetch(`${API}/diagrams`, { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    diagrams.unshift({
      analysis_id: data.analysis_id,
      name: selectedFile.name,
      status: data.status,
      created_at: new Date().toISOString(),
    });
    saveDiagrams();
    renderList();
    selectDiagram(data.analysis_id);
    clearFile();
    showToast(`Diagrama enviado! ID: ${data.analysis_id.slice(0, 8)}…`, 'ok');
  } catch (err) {
    showToast(`Erro ao enviar: ${err.message}`, 'err');
    uploadBtn.disabled = false;
  } finally {
    uploadBtn.textContent = 'Analisar diagrama';
    uploadBtn.disabled = !selectedFile;
  }
});

// ── List ───────────────────────────────────────────────────────────────────
const diagramList = document.getElementById('diagramList');
const emptyMsg    = document.getElementById('emptyMsg');

document.getElementById('clearAll').addEventListener('click', () => {
  if (!diagrams.length) return;
  if (!confirm('Limpar todo o histórico local?')) return;
  diagrams = [];
  selectedId = null;
  saveDiagrams();
  renderList();
  showPlaceholder();
});

function renderList() {
  emptyMsg.style.display = diagrams.length ? 'none' : 'block';
  const existing = {};
  diagramList.querySelectorAll('.diagram-item').forEach(el => existing[el.dataset.id] = el);

  diagrams.forEach((d, i) => {
    let el = existing[d.analysis_id];
    if (!el) {
      el = document.createElement('div');
      el.className = 'diagram-item';
      el.dataset.id = d.analysis_id;
      el.addEventListener('click', () => selectDiagram(d.analysis_id));
    }
    el.classList.toggle('active', d.analysis_id === selectedId);
    el.innerHTML = `
      <div class="item-top">
        <span class="item-name" title="${d.name}">${d.name}</span>
        <span class="badge badge-${d.status}">${labelStatus(d.status)}</span>
      </div>
      <div class="item-id">${d.analysis_id.slice(0, 18)}…</div>
    `;
    if (i === 0 && !existing[d.analysis_id]) {
      diagramList.insertBefore(el, diagramList.firstChild.nextSibling);
    } else if (!existing[d.analysis_id]) {
      diagramList.appendChild(el);
    }
  });
  // remove stale
  Object.keys(existing).forEach(id => {
    if (!diagrams.find(d => d.analysis_id === id)) existing[id].remove();
  });
}

function labelStatus(s) {
  return { RECEBIDO: 'Recebido', EM_PROCESSAMENTO: 'Processando', ANALISADO: 'Analisado', ERRO: 'Erro' }[s] || s;
}

// ── Selection & polling ───────────────────────────────────────────────────
async function selectDiagram(id) {
  selectedId = id;
  clearTimeout(pollTimer);
  renderList();

  const d = diagrams.find(x => x.analysis_id === id);
  if (!d) return;

  if (d.status === 'ANALISADO') {
    await loadReport(id);
  } else {
    renderStatusPanel(d);
    if (d.status !== 'ERRO') schedulePoll(id);
  }
}

function schedulePoll(id) {
  pollTimer = setTimeout(async () => {
    try {
      const res = await fetch(`${API}/diagrams/${id}/status`);
      if (!res.ok) return;
      const data = await res.json();
      const d = diagrams.find(x => x.analysis_id === id);
      if (!d) return;
      d.status = data.status;
      saveDiagrams();
      renderList();
      if (selectedId === id) {
        if (data.status === 'ANALISADO') {
          await loadReport(id);
        } else if (data.status === 'ERRO') {
          renderStatusPanel(d);
        } else {
          renderStatusPanel(d);
          schedulePoll(id);
        }
      }
    } catch { schedulePoll(id); }
  }, POLL_MS);
}

async function loadReport(id) {
  const d = diagrams.find(x => x.analysis_id === id);
  renderReportLoading(d);
  try {
    const res = await fetch(`${API}/diagrams/${id}/report`);
    if (!res.ok) {
      if (res.status === 404) { renderStatusPanel(d); schedulePoll(id); return; }
      throw new Error(`HTTP ${res.status}`);
    }
    const report = await res.json();
    renderReport(d, report);
  } catch (err) {
    renderError(`Erro ao carregar relatório: ${err.message}`);
  }
}

// ── Render helpers ─────────────────────────────────────────────────────────
const placeholder  = document.getElementById('placeholder');
const reportPanel  = document.getElementById('reportPanel');

function showPlaceholder() {
  placeholder.style.display = 'flex';
  reportPanel.style.display = 'none';
}

function showReport(html) {
  placeholder.style.display = 'none';
  reportPanel.style.display = 'block';
  reportPanel.innerHTML = html;
}

function renderStatusPanel(d) {
  const icons = { RECEBIDO: '📥', EM_PROCESSAMENTO: '⚙️', ERRO: '❌' };
  const colors = { RECEBIDO: 'var(--muted)', EM_PROCESSAMENTO: 'var(--warn)', ERRO: 'var(--danger)' };
  const msgs = {
    RECEBIDO: 'Diagrama recebido. Aguardando início do processamento…',
    EM_PROCESSAMENTO: 'O diagrama está sendo analisado pela IA. Atualizando automaticamente…',
    ERRO: 'Ocorreu um erro durante o processamento deste diagrama.',
  };
  const spinner = d.status === 'EM_PROCESSAMENTO'
    ? '<div class="spinner"></div>'
    : `<span style="font-size:1.4rem">${icons[d.status] || ''}</span>`;

  showReport(`
    <div class="report-header">
      <h2>${d.name}</h2>
      <div class="report-meta">
        <span>ID: ${d.analysis_id}</span>
        <span>Enviado em: ${fmtDate(d.created_at)}</span>
      </div>
    </div>
    <div class="processing-banner" style="border-color: ${colors[d.status]}20; background: ${colors[d.status]}0d; color: ${colors[d.status]}">
      ${spinner}
      <span>${msgs[d.status] || d.status}</span>
    </div>
  `);
}

function renderReportLoading(d) {
  showReport(`
    <div class="report-header">
      <h2>${d.name}</h2>
    </div>
    <div class="processing-banner">
      <div class="spinner"></div>
      <span>Carregando relatório…</span>
    </div>
  `);
}

function renderReport(d, r) {
  const components = r.components?.length
    ? r.components.map(c => `<span class="chip">${esc(c)}</span>`).join('')
    : '<span style="color:var(--muted);font-size:.85rem">Nenhum componente identificado.</span>';

  const risks = r.risks?.length
    ? r.risks.map(x => `<div class="risk-item">${esc(x)}</div>`).join('')
    : '<div style="color:var(--muted);font-size:.85rem">Nenhum risco identificado.</div>';

  const recs = r.recommendations?.length
    ? r.recommendations.map(x => `<div class="rec-item">${esc(x)}</div>`).join('')
    : '<div style="color:var(--muted);font-size:.85rem">Sem recomendações.</div>';

  showReport(`
    <div class="report-header">
      <h2>${esc(d.name)}</h2>
      <div class="report-meta">
        <span>ID: ${r.analysis_id}</span>
        <span>Gerado em: ${fmtDate(r.created_at)}</span>
      </div>
    </div>

    <div class="section">
      <h3>Resumo</h3>
      <div class="summary-box">${esc(r.summary)}</div>
    </div>

    <div class="section">
      <h3>Componentes identificados (${r.components?.length ?? 0})</h3>
      <div class="chip-list">${components}</div>
    </div>

    <div class="section">
      <h3>Riscos arquiteturais (${r.risks?.length ?? 0})</h3>
      <div class="risk-list">${risks}</div>
    </div>

    <div class="section">
      <h3>Recomendações (${r.recommendations?.length ?? 0})</h3>
      <div class="rec-list">${recs}</div>
    </div>
  `);
}

function renderError(msg) {
  showReport(`<div class="processing-banner" style="color:var(--danger);border-color:rgba(248,113,113,.2)">❌ ${esc(msg)}</div>`);
}

// ── Utils ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}
function showToast(msg, type) {
  toast.textContent = msg;
  toast.className = `toast show ${type}`;
}
function hideToast() {
  toast.className = 'toast';
}

// ── Init ───────────────────────────────────────────────────────────────────
renderList();
syncFromApi();

async function syncFromApi() {
  try {
    const res = await fetch(`${API}/diagrams`);
    if (!res.ok) return;
    const { items } = await res.json();

    let changed = false;
    for (const item of (items || [])) {
      const existing = diagrams.find(d => d.analysis_id === item.analysis_id);
      if (!existing) {
        diagrams.push({
          analysis_id: item.analysis_id,
          name: item.filename,
          status: item.status,
          created_at: item.created_at,
        });
        changed = true;
      } else if (existing.status !== item.status) {
        existing.status = item.status;
        changed = true;
      }
    }

    if (changed) {
      diagrams.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      saveDiagrams();
      renderList();
    }
  } catch { /* API offline — use localStorage */ }

  // Resume polling for in-progress items
  diagrams.forEach(d => {
    if (d.status === 'RECEBIDO' || d.status === 'EM_PROCESSAMENTO') {
      schedulePoll(d.analysis_id);
    }
  });
}
</script>
</body>
</html>
